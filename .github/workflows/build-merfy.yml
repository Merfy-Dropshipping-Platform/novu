name: Build Merfy Novu Images

on:
  push:
    branches: [next, merfy-v3.13.0]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: merfy-dropshipping-platform
  BUILD_REF: merfy-v3.13.0

jobs:
  build-api:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - uses: ./.github/actions/free-space
        name: Free disk space

      - name: Install pnpm
        uses: pnpm/action-setup@v3

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare API build
        run: |
          cp scripts/dotenvcreate.mjs apps/api/src/dotenvcreate.mjs
          cd apps/api
          sed -i.bak 's/pm2-runtime start dist\/main\.js -i max/node dist\/main.js/g' Dockerfile && rm -f Dockerfile.bak

      - name: Build API image
        run: |
          cd apps/api
          pnpm run docker:build
        env:
          DOCKER_BUILD_ARGUMENTS: ""
          BULL_MQ_PRO_NPM_TOKEN: ""

      - name: Push API image
        run: |
          docker tag novu-api ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/novu-api:3.13.0
          docker tag novu-api ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/novu-api:latest
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/novu-api:3.13.0
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/novu-api:latest

  build-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - uses: ./.github/actions/free-space
        name: Free disk space

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Dashboard image
        run: |
          cd apps/dashboard
          echo -e "\nVITE_SELF_HOSTED=true" >> .env
          docker buildx build --load -f ./dockerfile -t novu-dashboard ./../..

      - name: Push Dashboard image
        run: |
          docker tag novu-dashboard ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/novu-dashboard:3.13.0
          docker tag novu-dashboard ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/novu-dashboard:latest
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/novu-dashboard:3.13.0
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/novu-dashboard:latest
